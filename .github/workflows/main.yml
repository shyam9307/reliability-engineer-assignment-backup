
name: CI - Test and Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-assignment-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "819693014102"
  ECR_REPOSITORY: reliability-pipeline
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform initialization (validate providers only)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validation
        working-directory: infra/terraform
        run: terraform validate

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: reliability-pipeline:ci

  deploy-image:
    name: Manual AWS backend and image publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::819693014102:role/GitHubActions-ReliabilityAssignment
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Terraform state bucket
        run: |
          aws s3api head-bucket \
            --bucket relassign-tfstate-819693014102-819693014102-ap-south-1-an

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize S3 backend
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Validate Terraform with backend
        working-directory: infra/terraform
        run: terraform validate

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag-mutability IMMUTABLE \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Published image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Create Terraform plan (no infrastructure changes applied)
        working-directory: infra/terraform
        env:
          TF_VAR_container_image: ${{ steps.ecr-login.outputs.registry }}/reliability-pipeline:${{ github.sha }}
        run: terraform plan -input=false -out=tfplan

      - name: Save Terraform plan for review
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan
          retention-days: 1
