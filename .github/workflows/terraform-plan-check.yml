
name: Terraform Infrastructure Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reliability-assignment-terraform
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Validate and plan infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::819693014102:role/GitHubActions-ReliabilityAssignment
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names reliability-pipeline \
            --region "$AWS_REGION"

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate

      - name: Generate infrastructure plan
        working-directory: infra/terraform
        env:
          TF_VAR_container_image: 819693014102.dkr.ecr.ap-south-1.amazonaws.com/reliability-pipeline:latest
        run: terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Display plan for review
        working-directory: infra/terraform
        run: terraform show -no-color tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-terraform-plan
          path: infra/terraform/tfplan
          retention-days: 1
